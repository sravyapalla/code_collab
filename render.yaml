databases:
  - name: code-collab-db
    plan: free
    databaseName: code_collab
    user: code_collab_user

services:
  - type: web
    name: code-collab
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm --prefix backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SERVE_FRONTEND
        value: "true"
      - key: APP_HOST
        fromService:
          name: code-collab
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: code-collab-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: AI_MAX_INPUT_CHARS
        value: "24000"
      - key: AI_RATE_LIMIT_PER_ROOM
        value: "12"
      - key: AI_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: CODE_INDEX_DEBOUNCE_MS
        value: "900"
